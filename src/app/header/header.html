<nav class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 text-black shadow-xs transition-all duration-300">
  <div class="max-w-7xl mx-auto flex items-center justify-between h-20">
    
    <!-- Logo -->
    <div class="flex items-center gap-2.5 cursor-pointer" routerLink="/home">
      <img src="/Logo1.png" alt="Logo" class="h-10 w-auto object-contain">
      <span class="font-extrabold text-lg sm:text-xl tracking-tight text-slate-900">MediCare Central</span>
    </div>

    <!-- Desktop Links -->
    <ul class="hidden md:flex items-center gap-8 text-slate-600 font-bold text-sm">
      <li>
        <a routerLink="/home" routerLinkActive="!text-indigo-600" [routerLinkActiveOptions]="{exact: true}"
           class="hover:text-indigo-600 transition-colors duration-200 py-2">Giới thiệu</a>
      </li>
      <li>
        <a routerLink="/home/services" routerLinkActive="!text-indigo-600"
           class="hover:text-indigo-600 transition-colors duration-200 py-2">Dịch vụ</a>
      </li>
      <li>
        <a routerLink="/home/faq" routerLinkActive="!text-indigo-600"
           class="hover:text-indigo-600 transition-colors duration-200 py-2">Hỏi đáp</a>
      </li>
    </ul>

    <!-- Desktop Buttons -->
    <div class="hidden md:flex items-center gap-3">
      <a routerLink="/register" class="text-slate-700 hover:text-slate-900 font-bold text-sm px-4 py-2 transition-all">
        Đăng Ký
      </a>    
      <a routerLink="/login" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl transition-all shadow-md shadow-indigo-500/10">
        Đăng Nhập <span>&rarr;</span>
      </a>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-50 focus:outline-none transition-colors">
      <span class="text-2xl" *ngIf="!isMobileMenuOpen">☰</span>
      <span class="text-2xl font-bold" *ngIf="isMobileMenuOpen">✕</span>
    </button>

  </div>

  <!-- Mobile Menu Dropdown -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden border-t border-slate-100 bg-white px-4 py-6 space-y-4 shadow-xl animate-fade-in absolute left-0 right-0 z-40">
    <ul class="flex flex-col gap-4 text-slate-700 font-bold text-base">
      <li>
        <a routerLink="/home" routerLinkActive="text-indigo-600" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()"
           class="block py-2 hover:text-indigo-600 transition-all">Giới thiệu</a>
      </li>
      <li>
        <a routerLink="/home/services" routerLinkActive="text-indigo-600" (click)="closeMobileMenu()"
           class="block py-2 hover:text-indigo-600 transition-all">Dịch vụ</a>
      </li>
      <li>
        <a routerLink="/home/faq" routerLinkActive="text-indigo-600" (click)="closeMobileMenu()"
           class="block py-2 hover:text-indigo-600 transition-all">Hỏi đáp</a>
      </li>
    </ul>

    <div class="h-px bg-slate-100 my-4"></div>

    <div class="flex flex-col gap-3">
      <a routerLink="/register" (click)="closeMobileMenu()" class="w-full text-center py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-50 transition-all">
        Đăng Ký
      </a>    
      <a routerLink="/login" (click)="closeMobileMenu()" class="w-full text-center py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 transition-all shadow-md shadow-indigo-500/10">
        Đăng Nhập
      </a>
    </div>
  </div>
</nav>
