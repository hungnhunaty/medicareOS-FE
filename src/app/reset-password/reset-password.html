<div class="min-h-screen flex items-center justify-center p-6 font-sans bg-gradient-to-br from-[#111827] via-[#0B0F19] to-[#010409]">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-8 md:p-12">
    
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <div class="w-12 h-12 bg-teal-50 rounded-full flex items-center justify-center text-2xl">
          🔒
        </div>
      </div>
      <h3 class="text-2xl font-bold text-black tracking-tight">Đặt lại mật khẩu</h3>
      <p class="text-gray-500 text-sm mt-2">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
    </div>

    <!-- Alert Success -->
    <div *ngIf="successMessage" class="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-700 text-sm font-medium">
      {{ successMessage }} Đang chuyển hướng về trang Đăng nhập...
    </div>

    <!-- Alert Error -->
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-sm font-medium">
      {{ errorMessage }}
    </div>

    <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-widest text-black mb-2">Mật khẩu mới (tối thiểu 6 ký tự)</label>
        <input formControlName="newPassword" type="password" placeholder="••••••••" 
               class="w-full px-0 py-3 border-b-2 border-gray-100 focus:border-black outline-none transition-all duration-300 bg-transparent placeholder:text-gray-300 text-black text-sm">
        <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid" class="text-xs text-rose-600 mt-1">
          Mật khẩu phải chứa ít nhất 6 ký tự.
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-widest text-black mb-2">Xác nhận mật khẩu mới</label>
        <input formControlName="confirmPassword" type="password" placeholder="••••••••" 
               class="w-full px-0 py-3 border-b-2 border-gray-100 focus:border-black outline-none transition-all duration-300 bg-transparent placeholder:text-gray-300 text-black text-sm">
        <div *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid" class="text-xs text-rose-600 mt-1">
          Vui lòng nhập lại mật khẩu.
        </div>
        <div *ngIf="resetForm.touched && resetForm.hasError('mismatch')" class="text-xs text-rose-600 mt-1">
          Mật khẩu xác nhận không trùng khớp.
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" [disabled]="loading"
                class="w-full flex items-center justify-center py-4 font-bold text-white bg-black hover:bg-gray-800 rounded-full transition-all duration-300 active:scale-[0.98] disabled:bg-gray-400">
          <span *ngIf="!loading">Đổi mật khẩu</span>
          <span *ngIf="loading" class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-t-white border-r-transparent border-b-transparent border-l-transparent"></span>
        </button>
      </div>
    </form>

    <div class="text-center mt-8">
      <a routerLink="/login" class="text-sm font-bold text-black hover:underline">Quay lại Đăng nhập</a>
    </div>

  </div>
</div>
