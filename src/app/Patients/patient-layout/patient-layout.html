<div class="flex h-screen w-full bg-slate-50 text-slate-900 overflow-hidden antialiased">
  
  <!-- SIDEBAR -->
  <aside class="hidden lg:flex w-64 flex-col border-r border-slate-200 bg-white shadow-sm z-20 shrink-0">
    <!-- Header Logo -->
    <div class="flex h-16 items-center px-6 border-b border-slate-100 bg-white">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 text-white font-bold text-lg shadow-md shadow-rose-500/20">
          ❤️
        </div>
        <div class="flex flex-col">
          <span class="text-base font-black tracking-tight text-slate-900 uppercase leading-none">MediCare</span>
          <span class="text-[10px] font-bold text-rose-500 tracking-wider mt-0.5 uppercase">Patient Portal</span>
        </div>
      </div>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 overflow-y-auto px-4 py-6 space-y-1.5">
      <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">Hồ sơ cá nhân</p>
      
      <a routerLink="/patient/dashboard" 
         routerLinkActive="!bg-rose-500 !text-white shadow-md shadow-rose-500/20 font-semibold" 
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200 group">
        <span class="text-lg">🏥</span>
        <span>Sổ Khám Bệnh</span>
      </a>


      <a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 cursor-not-allowed transition-all duration-200" title="Tính năng sắp ra mắt">
        <span class="text-lg opacity-50">📑</span>
        <span>Hóa Đơn & Bảo Hiểm</span>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-slate-100 bg-slate-50/50">
      <button (click)="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 transition-all shadow-sm">
        <span>🚪</span>
        <span>Đăng Xuất</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="flex flex-1 flex-col overflow-hidden relative bg-slate-50/50">
    
    <!-- TOP HEADER BAR -->
    <header class="flex h-16 items-center justify-between px-4 md:px-8 bg-white border-b border-slate-200 z-10 shrink-0 shadow-xs">
      
      <div class="flex items-center">
        <!-- Hamburger Menu Button -->
        <button (click)="toggleMobileMenu()" class="lg:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 mr-2 focus:outline-none">
          <span class="text-xl">☰</span>
        </button>

        <div class="hidden sm:block">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Chào mừng quay trở lại!</p>
          <h2 class="text-sm font-black text-slate-900">Thông tin sức khỏe cá nhân của bạn</h2>
        </div>
      </div>

      <!-- Right profile & notifications -->
      <div class="flex items-center gap-4">
        
        <!-- User Profile Trigger -->
        <div class="relative">
          <div (click)="toggleProfileMenu()" class="flex items-center gap-3 cursor-pointer select-none py-1 px-2 rounded-xl hover:bg-slate-50 transition-all">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-rose-600 to-indigo-600 flex items-center justify-center text-xs font-bold text-white shadow-sm">
              BN
            </div>
            <div class="hidden md:flex md:flex-col">
              <p class="text-xs font-bold text-slate-900 leading-none">{{ fullName }}</p>
              <p class="text-[10px] font-medium text-slate-400 mt-1">Hồ sơ: {{ patientCode }}</p>
            </div>
          </div>
        </div>

      </div>
    </header>

    <!-- MAIN SCROLLABLE OUTLET CONTAINER -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

  <!-- MOBILE SIDEBAR DRAWER -->
  <div *ngIf="isMobileMenuOpen" class="fixed inset-0 z-50 flex lg:hidden">
    <!-- Backdrop overlay -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity duration-300" (click)="closeMobileMenu()"></div>
    
    <!-- Drawer content -->
    <aside class="relative flex w-64 flex-col bg-white h-full shadow-2xl z-10 animate-slide-in-left">
      <div class="flex h-16 items-center justify-between px-6 border-b border-slate-100 bg-white">
        <div class="flex items-center gap-3">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 text-white font-bold text-lg shadow-md shadow-rose-500/20">
            ❤️
          </div>
          <div class="flex flex-col">
            <span class="text-base font-black tracking-tight text-slate-900 uppercase leading-none">MediCare</span>
            <span class="text-[10px] font-bold text-rose-500 tracking-wider mt-0.5 uppercase">Patient Portal</span>
          </div>
        </div>
        <button (click)="closeMobileMenu()" class="h-8 w-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400 focus:outline-none">
          ✕
        </button>
      </div>
      
      <nav class="flex-1 overflow-y-auto px-4 py-6 space-y-1.5" (click)="closeMobileMenu()">
        <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">Hồ sơ cá nhân</p>
        
        <a routerLink="/patient/dashboard" 
           routerLinkActive="!bg-rose-500 !text-white shadow-md shadow-rose-500/20 font-semibold" 
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200">
          <span class="text-lg">🏥</span>
          <span>Sổ Khám Bệnh</span>
        </a>

        <a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 cursor-not-allowed transition-all duration-200">
          <span class="text-lg opacity-50">📑</span>
          <span>Hóa Đơn & Bảo Hiểm</span>
        </a>
      </nav>

      <div class="p-4 border-t border-slate-100 bg-slate-50/50">
        <button (click)="logout(); closeMobileMenu()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 transition-all shadow-sm">
          <span>🚪</span>
          <span>Đăng Xuất</span>
        </button>
      </div>
    </aside>
  </div>
</div>
