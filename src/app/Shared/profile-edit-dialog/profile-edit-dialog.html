<div *ngIf="showModal" class="fixed inset-0 z-[100] flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>
  
  <!-- Modal Content -->
  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 md:p-8 z-10 animate-fade-in-up">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
      <div>
        <h3 class="text-xl font-bold text-slate-900">Thông tin cá nhân</h3>
        <p class="text-xs text-slate-500 mt-1">Cập nhật hồ sơ của bạn</p>
      </div>
      <button (click)="closeModal()" class="p-2 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Họ và Tên <span class="text-rose-500">*</span></label>
        <input type="text" [(ngModel)]="currentUser.fullName" placeholder="Nhập họ và tên" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none text-sm font-medium text-slate-700">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Email <span class="text-rose-500">*</span></label>
        <input type="email" [(ngModel)]="currentUser.email" placeholder="example@gmail.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none text-sm font-medium text-slate-700">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Số điện thoại</label>
          <input type="text" [(ngModel)]="currentUser.phone" placeholder="090..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none text-sm font-medium text-slate-700">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Giới tính</label>
          <select [(ngModel)]="currentUser.gender" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none text-sm font-medium text-slate-700">
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Ngày sinh</label>
          <input type="date" [(ngModel)]="currentUser.dob" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none text-sm font-medium text-slate-700">
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Địa chỉ</label>
        <input type="text" [(ngModel)]="currentUser.address" placeholder="Nhập địa chỉ" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none text-sm font-medium text-slate-700">
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-slate-100">
      <button (click)="closeModal()" class="px-5 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
        Hủy bỏ
      </button>
      <button (click)="saveProfile()" class="px-5 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md shadow-indigo-500/30 rounded-xl transition-all">
        Lưu thay đổi
      </button>
    </div>
  </div>
</div>
